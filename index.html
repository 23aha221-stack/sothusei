        let isSuccess = false;

        // ① 確率抽選 (1/10 = 10%)
        if (Math.random() < 0.1) isSuccess = true;

        // ② 小役書き換え (強レア役なら確定！)
        // ※PDF仕様: 「5Gの間にレア役を引く or 大当たりを引いたらAT」
        if (["強チェ", "チャンス", "スイカ強", "強イチゴ", "中チェ"].includes(currentHitRole)) {

            return;
        }

        // 失敗判定 (5G消化してダメだった場合)
        if (lastChallengeG >= 5) {
            alert("ラストチャレンジ失敗…… 通常へ");
            currentState = GAME_STATE.NORMAL;
            // 枠色とか変えてたら戻す処理もここに
        }
    }

    // --- 4. CZ中 ---
    else if (currentState === GAME_STATE.CZ) {
        // ... (既存のCZ処理) ...
        // さっき作ったやつがあればそのまま
        czRemainingGames--;
        let rate = CZ_CONFIG.HIT_RATES[currentHitRole] || 0;
        if (Math.random() * 100 < rate) {
            alert("CZ成功！");
            document.querySelector('.panel-container').style.borderColor = "#555";
            startBonus();
            return;
        }
        if (czRemainingGames <= 0) {
            alert("CZ失敗...");
            currentState = GAME_STATE.NORMAL;
            document.querySelector('.panel-container').style.borderColor = "#555";
        }
    }

    // --- 5. AT中 (通常・上位共通) ---
    if (currentState === GAME_STATE.AT || currentState === GAME_STATE.AT_HYPER) {
        atGames--; // ゲーム数消化
        
        // --- 演出強化: 上位AT中は文字をピカピカさせたいならここ ---
        // (updateStateDisplayでやってるからそのままでOK)

        if (atGames <= 0) {
            // ★追加ロジック: 上位ATでストックがある場合
            if (currentState === GAME_STATE.AT_HYPER && hyperStock > 0) {
                hyperStock--; // ストック消費
                atGames = 20; // ゲーム数再セット
                
                // 演出: 終わったと見せかけて…？
                alert("まだまだぁ！！\nHYPER LOOP発動！ (残りストックあり)");
                console.log(`HYPER継続！ 残りストック: ${hyperStock}`);
                updateStateDisplay();
                return; // ここで処理を終えて、ジャッジへは行かせない
            }

            // ストックがない、または通常ATなら終了してジャッジへ
            alert("AT終了……継続ジャッジへ");
            isAT = false;
            currentState = GAME_STATE.JUDGE_PREP;
            judgePrepCount = 0;
            
            // 画面の装飾を戻す（もし変えていれば）
            document.getElementById('state-display').style.textShadow = "none";
        }
    }

    // --- 6. 継続ジャッジ準備中 ---
    else if (currentState === GAME_STATE.JUDGE_PREP) {
        // PDF仕様：1枚払い出し(弱イチゴ/一枚役)が2回出るまで待機
        if (currentHitRole === "一枚役" || currentHitRole === "弱イチゴ") { // 名前は定義に合わせて
            judgePrepCount++;
        }
        
        if (judgePrepCount >= 2) {
            alert("準備完了！継続ジャッジ開始(5G)！");
            currentState = GAME_STATE.JUDGE_ACT;
            judgeGames = 0;
        }
    }

    // --- 7. 継続ジャッジ (5G) ---
    else if (currentState === GAME_STATE.JUDGE_ACT) {
        judgeGames++;
        
        let isSuccess = false;
        let isHyper = false;

        // ストックがあれば無条件成功
        if (hasAtStock) {
            isSuccess = true;
            // 上位AT中なら継続確定＝上位ループ
            if (currentState === GAME_STATE.AT_HYPER) isHyper = true; 
            hasAtStock = false; // ストック消費
            console.log("ストック放出！");
            isAT = true;
        } 
        // 自力抽選 (レア役 or 1/6)
        else {
            if (Math.random() < (1/6)) isSuccess = true;
            if (["強チェ", "チャンス", "スイカ強"].includes(currentHitRole)) isSuccess = true;
        }

        if (isSuccess) {
            // PDF仕様：1/25で上位ATへ
            if (Math.random() < (1/25)) {
                isAT = true;
                isUpperAT = true;
                startHyperAT();
            } else {
                // 通常ATへ復帰（ゲーム数は振り分けだが今回は20G固定で）
                alert("継続成功！RUSH復帰！");
                isAT = true;
                // もし元々上位ATだった場合はどうするか？
                // 仕様の読み解きによるが、一般的に上位ループ漏れは通常ATに落ちるか終わるか。
                // ここでは「成功＝現状維持以上」としておく。
                if (currentState === GAME_STATE.AT_HYPER) startHyperAT(); // ループ
                else startNormalAT(20);
            }
            return; // 処理終了
        }

        // 5G駆け抜け失敗
        if (judgeGames >= 5) {
            alert("ジャッジ失敗……通常へ");
            if (isUpperAT) {
                pullBackGames = 72; // 上位後は72G
            } else {
                pullBackGames = 66; // 通常後は66G
            }
            console.log("引き戻し区間突入：" + pullBackGames);
            currentState = GAME_STATE.PULL_BACK;
            isAT = false;
            // 引き戻し区間(66G)などはここに実装するが、まずは通常へ戻す
        }
    }
    else if (currentState === GAME_STATE.PULL_BACK) {
        pullBackGames--;

        // 1/32.0 の引き戻し抽選 
        if (Math.random() * 100 < PULLBACK_WIN_RATE) {
            console.log("🔥 引き戻し成功！ 🔥");

        }

        // 規定ゲーム数消化で通常へ
        if (pullBackGames <= 0) {
            console.log("引き戻し失敗。通常へ戻ります");
            currentState = GAME_STATE.NORMAL;
            isUpperAT = false;
        }
    }

    updateStateDisplay();
}

// ウェイトを考慮して回転を試みる関数
function attemptSpin() {
    // すでに回っている、またはウェイト処理中なら無視
    if (isStopping || isWaiting || spiningLReel || spiningCReel || spiningRReel) return;

    const now = Date.now();
    const timeSinceLastStart = now - lastGameStartTime; // 前回の開始から何ミリ秒経ったか

    if (timeSinceLastStart < MIN_WAIT_TIME) {
        // --- ウェイト発生！ ---
        const waitDuration = MIN_WAIT_TIME - timeSinceLastStart; // 残り待ち時間
        
        console.log(`ウェイト作動: 残り ${waitDuration}ms 待ちます`);
        isWaiting = true;
        toggleWaitLamp(true); // ランプ点灯

        // 残り時間だけ待ってから回転開始
        setTimeout(() => {
            isWaiting = false;
            toggleWaitLamp(false); // ランプ消灯
            startGameLogic(); // 実際の回転処理へ
        }, waitDuration);

    } else {
        // --- ウェイトなし（4.1秒以上経過している） ---
        startGameLogic();
    }
}

function decideStop(result) {
    const pattern = stopPatterns[result];

    // 全リール（0:左, 1:中, 2:右）に対してループ処理
    let stops = [0, 0, 0];
    for (let r = 0; r < 3; r++) {
        let targetPositions;
        
        // パターンが "ANY" の場合、禁止位置を除外して抽選する
        if ((r === 0 && pattern.left === "ANY") || 
            (r === 1 && pattern.center === "ANY") || 
            (r === 2 && pattern.right === "ANY")) {
            
            // 1. このリール(r)における「禁止インデックス」を全て集める
            let forbiddenIndices = new Set();
            forbiddenKeys.forEach(key => {
                let p = stopPatterns[key];
                let indices = (r === 0) ? p.left : (r === 1) ? p.center : p.right;
                
                if (Array.isArray(indices)) {
                    indices.forEach(idx => forbiddenIndices.add(idx));
                }
            });

            // 2. 0～20の中で、禁止されていない「安全なインデックス」を抽出
            let safeIndices = [];
            for (let i = 0; i < reelLength; i++) {
                if (!forbiddenIndices.has(i)) {
                    safeIndices.push(i);
                }
            }

            // 安全な場所が一つもない場合は、仕方ないのでcurrentIndex（現在の位置）にするなどの保険
            if (safeIndices.length === 0) {
                console.warn(`リール${r+1}: 停止可能な位置がありません。設定を見直してください。`);
                stops[r] = currentIndex[r]; 
            } else {
                // 3. 安全なリストからランダムに選ぶ
                stops[r] = safeIndices[Math.floor(Math.random() * safeIndices.length)];
            }

        } else {
            // "ANY" じゃない場合は、指定された配列から選ぶ（既存のロジック）
            let arr = (r === 0) ? pattern.left : (r === 1) ? pattern.center : pattern.right;
            stops[r] = Array.isArray(arr) ? arr[Math.floor(Math.random() * arr.length)] : currentIndex[r];
        }
    }

    return stops;
}

function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1)); // 0〜i のどれか
                [array[i], array[j]] = [array[j], array[i]];   // 要素を交換
            }
            return array;
        }

let correctOrder = []; // 今回の正解の押し順 (例: [0, 1, 2])
let playerOrder = [];  // プレイヤーが実際に押した順

const CHARACTER_LINES = [
    { text: "準備はいい？行くよ！", color: "white" },
    { text: "おっ、これはチャンスかも？", color: "blue" }, // 青文字（信頼度UP）
    { text: "激アツだね！", color: "red" },            // 赤文字（高期待度）
];

function updateLCD(state) {
    const screen = document.getElementById('lcd-screen');
    
    if (state === "start") {
        // 回転開始時：ランダムにセリフを表示
        const rand = Math.floor(Math.random() * 10); // 0~9
        
        // 30%の確率でセリフを喋らせるテスト
        if (rand < 3) {
            const line = CHARACTER_LINES[rand];
            screen.innerHTML = `
                <div class="message-box" style="color: ${line.color}; border-color: ${line.color};">
                    ${line.text}
                </div>
            `;
        } else {
            // 何もなければ演出なし（背景のみ）
            screen.innerHTML = ""; 
        }
    } else if (state === "stop") {
        // 全リール停止時：元の画面に戻す（または結果表示）
        screen.innerHTML = `
            <div class="default-screen">
                <p class="logo-text">testSlot</p>
            </div>
        `;
    }
}

function startReels() {

    if (isBusy) return;

    reelStartTime = Date.now();

    
    setTimeout(() => {
        for(let i = 0; i < 3; i++) {
            updateButtonLights(i);
        }
        
    }, STOP_LOCK_TIME);

    if (!spiningLReel && !spiningCReel && !spiningRReel) {
        // ★ここに追加：ペナルティフラグをリセット
        document.getElementById('warning-overlay').style.display = 'none';
        isPenalty = false;
        // メダルを消費
        credits -= 3;
        payout = 0; // 払い出し表示をリセット
        updatePanel(); // 画面更新

        updateLCD("start");

        playerOrder = [];
        correctOrder = [];
        hideNavi(); // ナビを隠す関数（後で作る）

        picupRandInt();
        spiningLReel = true;
        spiningCReel = true;
        spiningRReel = true;
        for (let r = 0; r < 3; r++) {
            // ★追加：回転クラスをつける
            document.getElementById(`reel${r+1}`).classList.add('spinning');
            reelTimers[r] = setInterval(() => {
                const reel = document.getElementById(`reel${r+1}`);
                reel.innerHTML = '';
                for (let i = 3; i > 0; i--) {
                const symbolIndex = (currentIndex[r] + i) % reelLength;
                const img = document.createElement('img');
                img.src = reels[r][symbolIndex];
                img.className = 'symbol';
                reel.appendChild(img);
                }
                currentIndex[r] = (currentIndex[r] + 1) % reelLength;
            }, frameInterval);
        }
    }
}

function hideNavi() {
    for(let i=0; i<3; i++) {
        document.getElementById(`navi-${i}`).style.display = 'none';
    }
}

function renderReel(reelIndex) {
    const reel = document.getElementById(`reel${reelIndex+1}`);
    reel.innerHTML = '';
    for (let i = 0; i < 3; i++) {
        const symbolIndex = (currentIndex[reelIndex] + i) % reelLength;
        const img = document.createElement('img');
        img.src = reels[reelIndex][symbolIndex];
        img.className = 'symbol';
        reel.appendChild(img);
    }
}


function stopReel(reelIndex, tgtIndex) {
    // 1. 他のリールを停止処理中なら、この呼び出しは完全に無視する
    if (isStopping) return;

    const currentTime = Date.now();
    
    // 回り始めてから 500ms 経っていない場合は、何もしない（return）
    if (currentTime - reelStartTime < STOP_LOCK_TIME || !spiningCReel && !spiningLReel && !spiningRReel) {
        console.log("まだリールが安定していません！");
        return;
    }

    // 2. 指定されたリールが「既に止まっている」なら、何もせずに関数を終わる
    if (reelIndex === 0 && !spiningLReel) return;
    if (reelIndex === 1 && !spiningCReel) return;
    if (reelIndex === 2 && !spiningRReel) return;

    // 3. 停止処理を開始するのでロックをかける
    isStopping = true;

    // 通常時第一停止が左以外ならペナルティ確定
    if (!isAT && playerOrder.length === 0 && reelIndex !== 0) {
        isPenalty = true;
        console.log("ペナルティ！左以外から押されました");
    }

    // --- 停止メイン処理 ---
    if(reelIndex == 0 && spiningLReel) {
        playerOrder.push(reelIndex);
        document.getElementById(`reel${reelIndex+1}`).classList.remove('spinning');
        clearInterval(reelTimers[reelIndex]);
        currentIndex[reelIndex] = tgtIndex[reelIndex];
        renderReel(reelIndex);
        spiningLReel = false;
        updateButtonLights(0);
    }
    else if(reelIndex == 1 && spiningCReel) { // else if にすることで確実に1つずつ判定
        document.getElementById(`reel${reelIndex+1}`).classList.remove('spinning');
        playerOrder.push(reelIndex);
        clearInterval(reelTimers[reelIndex]);
        currentIndex[reelIndex] = tgtIndex[reelIndex];
        renderReel(reelIndex);
        spiningCReel = false;
        updateButtonLights(1);
    }
    else if(reelIndex == 2 && spiningRReel) {
        document.getElementById(`reel${reelIndex+1}`).classList.remove('spinning');
        playerOrder.push(reelIndex);
        clearInterval(reelTimers[reelIndex]);
        currentIndex[reelIndex] = tgtIndex[reelIndex];
        renderReel(reelIndex);
        spiningRReel = false;
        updateButtonLights(2);
    }

    // キーボードの指が離れた瞬間に実行される
    window.addEventListener('keyup', (event) => {
    const key = event.key;
    // 停止に使うキー（左・下・右矢印など）が離されたらロック解除
    if (key === 'ArrowLeft' || key === 'ArrowDown' || key === 'ArrowRight') {
        isStopping = false; 
        //console.log("ボタンが離されたのでロックを解除しました");
    }
});

    // ■ 全てのリールが止まったかチェック
    if (!spiningLReel && !spiningCReel && !spiningRReel) {
        isBusy = true;
        updateLCD("stop");
        setTimeout(checkPayout, 200); 
    }
}

// ■ キーボード操作のイベントリスナー
document.addEventListener('keydown', function(event) {
    
    // 連打防止や、変な挙動を防ぐための基本チェック
    // ※もしtgtIndexが未定義（まだ回してない）の時に止めようとするとエラーになるのを防ぐ
    
    switch(event.key) {
        // --- レバーオン (Qキー) ---
        case 'q':
        case 'Q':
            // 既に回っている時は反応させない等の制御は startReels 内にあるはずだが念のため
            attemptSpin();
            //startReels();
            break;

        // --- 左停止 (←キー) ---
        case 'ArrowLeft':
            // tgtIndexが存在するか（回っているか）チェック
            if (typeof tgtIndex !== 'undefined') {
                stopReel(0, tgtIndex);
            }
            break;

        // --- 中停止 (↓キー) ---
        case 'ArrowDown':
            // パチスロの真ん中ボタンは配置的に「↓」がしっくり来るよな
            if (typeof tgtIndex !== 'undefined') {
                stopReel(1, tgtIndex);
            }
            // 画面スクロールを防ぐ
            event.preventDefault(); 
            break;

            if (typeof tgtIndex !== 'undefined') {
